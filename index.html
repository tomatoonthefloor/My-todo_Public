<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f1">
<title>My Todo</title>

<style>

:root{
    --bg:#f4f4f1;
    --card:#fff;
    --soft:#f8f8f6;
    --line:#e8e8e4;
    --text:#171717;
    --muted:#8a8a84;
    --accent:#1f1f1d;
    --shadow:0 14px 40px rgba(20,20,18,.06);
}

*{
    box-sizing:border-box;
}

html{
    min-height:100%;
    background:var(--bg);
}

body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
    color:var(--text);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
}

button,
input,
select{
    font:inherit;
}

button{
    color:inherit;
}

/* =========================
   APP
========================= */

.app{
    width:min(1480px,100%);
    min-height:100vh;
    margin:0 auto;
    padding:34px 38px 40px;
}

.app-topbar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom:28px;
}

.brand-wrap h1{
    margin:0;
    font-size:30px;
    line-height:1;
    letter-spacing:-1.2px;
    font-weight:760;
}

.brand-wrap p{
    margin:8px 0 0;
    color:var(--muted);
    font-size:13px;
}

.account-area{
    display:flex;
    align-items:center;
    gap:8px;
}

.account-pill{
    display:flex;
    align-items:center;
    gap:8px;
    min-height:38px;
    padding:0 13px;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(255,255,255,.75);
    color:#555;
    font-size:12px;
}

.account-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#5ca77a;
}

#logoutButton{
    border:0;
    background:transparent;
    color:#888;
    font-size:12px;
    cursor:pointer;
    padding:8px 4px;
}

#logoutButton:hover{
    color:var(--text);
}

/* =========================
   WORKSPACE
========================= */

.workspace{
    display:grid;
    grid-template-columns:minmax(0,1.45fr) minmax(420px,1fr);
    gap:22px;
    align-items:stretch;
}

.panel{
    background:var(--card);
    border:1px solid rgba(0,0,0,.025);
    border-radius:28px;
    box-shadow:var(--shadow);
}

/* =========================
   CALENDAR
========================= */

.calendar-section{
    padding:30px;
    min-width:0;
}

.calendar-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
}

.month-heading{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.month-kicker{
    color:var(--muted);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-weight:650;
}

#monthTitle{
    font-size:27px;
    font-weight:760;
    letter-spacing:-1px;
}

.month-nav{
    display:flex;
    gap:6px;
}

.calendar-header button{
    width:38px;
    height:38px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
    cursor:pointer;
    font-size:21px;
    line-height:1;
    transition:.15s ease;
}

.calendar-header button:hover{
    background:var(--soft);
    transform:translateY(-1px);
}

.calendar{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    gap:8px;
    width:100%;
}

.weekday{
    padding:0 0 9px;
    text-align:center;
    color:#aaa9a3;
    font-size:11px;
    font-weight:700;
}

.day{
    min-height:112px;
    padding:11px;
    border:1px solid var(--line);
    border-radius:17px;
    background:#fff;
    cursor:pointer;
    position:relative;
    text-align:left;
    transition:background .15s ease,border-color .15s ease,transform .15s ease;
    overflow:hidden;
}

.day:hover{
    background:#fafaf8;
    border-color:#dcdcd7;
    transform:translateY(-1px);
}

.day.selected{
    background:#f1f1ed;
    border-color:#d6d6d0;
}

.day.today{
    border-color:#222;
}

.day > div:first-child{
    font-size:13px;
    font-weight:650;
}

.todo-count{
    display:inline-flex;
    align-items:center;
    margin-top:13px;
    padding:5px 8px;
    border-radius:999px;
    background:#f4f4f1;
    color:#77766f;
    font-size:10px;
    font-weight:650;
}

.day.today .todo-count{
    background:#e9e9e3;
}

.day.drag-over{
    background:#efefeb;
    border:2px dashed #aaa9a2;
}

/* =========================
   TODO SECTION
========================= */

.todo-section{
    display:flex;
    flex-direction:column;
    min-width:0;
    padding:30px;
}

.todo-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
    margin-bottom:22px;
}

.todo-header small{
    display:block;
    margin-bottom:7px;
    color:var(--muted);
    font-size:11px;
    font-weight:650;
    letter-spacing:.05em;
    text-transform:uppercase;
}

#selectedDateTitle{
    font-size:25px;
    line-height:1.15;
    font-weight:760;
    letter-spacing:-.7px;
}

.todo-total{
    min-width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:#f4f4f1;
    color:#777;
    font-size:13px;
    font-weight:700;
}

/* =========================
   CATEGORY
========================= */

.category-manager{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto auto;
    gap:8px;
    margin-bottom:10px;
}

#categoryInput{
    width:100%;
    min-width:0;
    padding:12px 13px;
    border:1px solid var(--line);
    border-radius:13px;
    background:#fafaf8;
    outline:none;
    color:var(--text);
    font-size:13px;
    transition:.15s ease;
}

#categoryInput:focus{
    border-color:#bdbdb6;
    background:#fff;
}

#addCategory{
    flex:none;
    padding:0 14px;
    border:0;
    border-radius:13px;
    background:#f0f0ec;
    color:#666;
    cursor:pointer;
    font-size:12px;
    font-weight:650;
}

#addCategory:hover{
    background:#e8e8e3;
}

/* 색상 선택 버튼 */

#categoryColorPicker{
    width:44px;
    height:44px;
    padding:4px;
    border:1px solid var(--line);
    border-radius:13px;
    background:#fafaf8;
    cursor:pointer;
}

#categoryColorPicker::-webkit-color-swatch-wrapper{
    padding:0;
}

#categoryColorPicker::-webkit-color-swatch{
    border:none;
    border-radius:8px;
}

/* 12색 팔레트 */

.color-palette{
    display:grid;
    grid-template-columns:repeat(12,1fr);
    gap:7px;
    margin-bottom:17px;
}

.color-option{
    width:100%;
    aspect-ratio:1;
    border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    position:relative;
    transition:.15s ease;
}

.color-option:hover{
    transform:scale(1.12);
}

.color-option.selected{
    border-color:#222;
    box-shadow:0 0 0 2px #fff inset;
}

.color-option.selected::after{
    content:"✓";
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:9px;
    font-weight:900;
    text-shadow:0 1px 2px rgba(0,0,0,.25);
}

#categoryList{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    min-height:30px;
    margin-bottom:19px;
}

.category-item{
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 9px;
    border:1px solid var(--line);
    border-radius:999px;
    background:#fff;
    color:#555;
    font-size:12px;
}

.category-color-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    flex:none;
}

.category-delete{
    width:17px;
    height:17px;
    padding:0;
    border:0;
    border-radius:50%;
    background:transparent;
    color:#aaa;
    cursor:pointer;
    line-height:17px;
}

.category-delete:hover{
    background:#f1f1ed;
    color:#555;
}

/* =========================
   TODO INPUT
========================= */

.todo-input-area{
    display:grid;
    grid-template-columns:120px minmax(0,1fr) 50px;
    gap:8px;
    margin-bottom:20px;
}

#todoCategory,
#todoInput{
    width:100%;
    min-width:0;
    padding:13px;
    border:1px solid var(--line);
    border-radius:13px;
    background:#fafaf8;
    outline:none;
    color:var(--text);
    font-size:13px;
    transition:.15s ease;
}

#todoCategory:focus,
#todoInput:focus{
    border-color:#bdbdb6;
    background:#fff;
}

#addTodo{
    border:0;
    border-radius:13px;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
    font-size:15px;
    font-weight:700;
    transition:.15s ease;
}

#addTodo:hover{
    background:#373733;
    transform:translateY(-1px);
}

/* =========================
   TODO LIST
========================= */

#todoList{
    flex:1;
    min-height:260px;
    overflow-y:auto;
    padding-right:3px;
}

#todoList::-webkit-scrollbar{
    width:5px;
}

#todoList::-webkit-scrollbar-thumb{
    background:#ddd;
    border-radius:10px;
}

.todo-category-group{
    margin-bottom:21px;
}

.todo-category-title{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:9px;
    color:#77766f;
    font-size:12px;
    font-weight:750;
}

.todo-category-title::before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--category-color,#c9c9c3);
}

/* =========================
   TODO ITEM
========================= */

.todo-item{
    display:flex;
    align-items:center;
    gap:13px;
    width:100%;
    padding:14px 13px;
    margin-bottom:8px;
    border:1px solid #eeeeea;
    border-radius:15px;
    background:#fff;
    cursor:grab;
    transition:.15s ease;
}

.todo-item:hover{
    border-color:#deded9;
    background:#fafaf8;
    transform:translateY(-1px);
}

.todo-item:active{
    cursor:grabbing;
}

.todo-item.dragging{
    opacity:.4;
    transform:scale(.99);
}

.todo-item.drag-over{
    border-top:2px solid #333;
}

/* =========================
   TOMATO CHECK BUTTON
========================= */

.tomato-check{
    width:29px;
    height:29px;
    flex:0 0 29px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    border:0;
    background:transparent;
    cursor:pointer;
    font-size:24px;
    line-height:1;
    filter:grayscale(1);
    opacity:.55;
    transition:.18s ease;
}

.tomato-check:hover{
    transform:scale(1.12);
    opacity:.8;
}

.tomato-check.completed{
    filter:none;
    opacity:1;
}

/*
완료 토마토의 색감을 카테고리에 맞게 조금씩 조정
*/

.tomato-check.completed[data-color="pink"]{
    filter:hue-rotate(310deg) saturate(.9);
}

.tomato-check.completed[data-color="orange"]{
    filter:hue-rotate(15deg) saturate(1.1);
}

.tomato-check.completed[data-color="yellow"]{
    filter:hue-rotate(45deg) saturate(1.2);
}

.tomato-check.completed[data-color="green"]{
    filter:hue-rotate(75deg) saturate(.8);
}

.tomato-check.completed[data-color="blue"]{
    filter:hue-rotate(165deg) saturate(.9);
}

.tomato-check.completed[data-color="purple"]{
    filter:hue-rotate(250deg) saturate(.9);
}

.todo-item span.todo-text{
    flex:1;
    min-width:0;
    color:#30302d;
    font-size:15px;
    line-height:1.4;
    cursor:pointer;
    word-break:break-word;
}

.todo-item span.todo-text.completed{
    text-decoration:line-through;
    color:#999;
}

.todo-item button.delete-todo{
    flex:none;
    border:0;
    background:transparent;
    color:#bbb;
    cursor:pointer;
    font-size:12px;
    line-height:1;
    padding:5px 3px;
    opacity:0;
    transition:.15s ease;
}

.todo-item:hover button.delete-todo{
    opacity:1;
}

.todo-item button.delete-todo:hover{
    color:#555;
}

/* =========================
   LOGIN
========================= */

#loginScreen,
#authSuccessScreen{
    position:fixed;
    inset:0;
    z-index:9999;
    background:rgba(244,244,241,.98);
    align-items:center;
    justify-content:center;
    padding:20px;
}

#loginScreen{
    display:none;
}

.auth-card{
    width:min(420px,100%);
    padding:42px;
    background:#fff;
    border:1px solid rgba(0,0,0,.03);
    border-radius:28px;
    box-shadow:0 24px 70px rgba(20,20,18,.09);
}

.auth-logo{
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:24px;
    border-radius:15px;
    background:#1f1f1d;
    color:#fff;
    font-size:20px;
    font-weight:800;
}

.auth-card h2{
    margin:0;
    font-size:28px;
    letter-spacing:-1px;
}

.auth-card p{
    margin:9px 0 28px;
    color:#8a8983;
    font-size:13px;
    line-height:1.55;
}

.auth-field{
    width:100%;
    padding:14px;
    margin-bottom:9px;
    border:1px solid var(--line);
    border-radius:13px;
    background:#fafaf8;
    outline:none;
    font-size:13px;
}

.auth-field:focus{
    border-color:#bdbdb6;
    background:#fff;
}

.auth-primary,
.auth-secondary{
    width:100%;
    padding:14px;
    border-radius:13px;
    cursor:pointer;
    font-size:13px;
    font-weight:700;
}

.auth-primary{
    margin-top:6px;
    border:0;
    background:#1f1f1d;
    color:#fff;
}

.auth-secondary{
    margin-top:8px;
    border:1px solid var(--line);
    background:#fff;
    color:#666;
}

.auth-primary:hover{
    background:#353532;
}

.auth-secondary:hover{
    background:#fafaf8;
}

#authMessage{
    min-height:18px;
    margin:15px 0 0;
    text-align:center;
    color:#8a8983;
    font-size:12px;
    line-height:1.5;
}

/* =========================
   SUCCESS
========================= */

#authSuccessScreen{
    display:none;
}

#authSuccessScreen.show{
    display:flex;
}

.success-icon{
    width:62px;
    height:62px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:22px;
    border-radius:20px;
    background:#edf4ee;
    color:#4c8a61;
    font-size:28px;
    font-weight:800;
}

.success-card h2{
    margin-bottom:0;
}

.success-card p{
    margin-bottom:25px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width:1100px){

    .workspace{
        grid-template-columns:1fr;
    }

    .todo-section{
        min-height:520px;
    }
}

@media (max-width:640px){

    body{
        background:#f4f4f1;
    }

    .app{
        padding:18px 12px 24px;
    }

    .app-topbar{
        align-items:center;
        margin-bottom:16px;
    }

    .brand-wrap h1{
        font-size:25px;
    }

    .brand-wrap p{
        display:none;
    }

    .account-pill{
        min-height:32px;
        padding:0 10px;
    }

    .account-pill span:last-child{
        max-width:100px;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
    }

    #logoutButton{
        display:none;
    }

    .panel{
        border-radius:24px;
    }

    .calendar-section{
        padding:20px 14px 18px;
    }

    .calendar-header{
        margin-bottom:18px;
    }

    #monthTitle{
        font-size:22px;
    }

    .month-kicker{
        font-size:9px;
    }

    .calendar{
        gap:5px;
    }

    .weekday{
        padding-bottom:7px;
        font-size:9px;
    }

    .day{
        min-height:65px;
        padding:8px 6px;
        border-radius:12px;
    }

    .day > div:first-child{
        font-size:11px;
    }

    .todo-count{
        margin-top:7px;
        padding:3px 5px;
        font-size:8px;
    }

    .todo-section{
        min-height:500px;
        padding:20px 14px 18px;
    }

    #selectedDateTitle{
        font-size:21px;
    }

    .todo-input-area{
        grid-template-columns:1fr 44px;
    }

    #todoCategory{
        display:none;
    }

    .category-manager{
        grid-template-columns:minmax(0,1fr) auto;
    }

    #categoryColorPicker{
        display:none;
    }

    .color-palette{
        grid-template-columns:repeat(6,1fr);
        gap:8px;
    }

    .todo-item{
        padding:14px 11px;
    }

    .todo-item span.todo-text{
        font-size:14px;
    }

    .delete-todo{
        opacity:1 !important;
    }

    #todoList{
        min-height:260px;
    }

    .auth-card{
        padding:30px 24px;
        border-radius:24px;
    }
}

</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="loginScreen">

    <div class="auth-card">

        <div class="auth-logo">✓</div>

        <h2>My Todo</h2>

        <p>
            로그인하고 어디서든 내 일정을<br>
            안전하게 관리하세요.
        </p>

        <input
            id="loginEmail"
            class="auth-field"
            type="email"
            placeholder="이메일"
            autocomplete="email"
        >

        <input
            id="loginPassword"
            class="auth-field"
            type="password"
            placeholder="비밀번호"
            autocomplete="current-password"
        >

        <button id="loginButton" class="auth-primary" type="button">
            로그인
        </button>

        <button id="signupButton" class="auth-secondary" type="button">
            회원가입
        </button>

        <p id="authMessage"></p>

    </div>

</div>


<!-- =========================
     EMAIL SUCCESS
========================= -->

<div id="authSuccessScreen">

    <div class="auth-card success-card">

        <div class="success-icon">✓</div>

        <h2>이메일 인증 완료</h2>

        <p>
            이메일 인증이 성공적으로 완료되었습니다.<br>
            이제 My Todo를 사용할 수 있습니다.
        </p>

        <button
            id="continueAfterVerification"
            class="auth-primary"
            type="button"
        >
            My Todo로 이동
        </button>

    </div>

</div>


<!-- =========================
     APP
========================= -->

<div class="app">

    <div class="app-topbar">

        <div class="brand-wrap">

            <h1>My Todo</h1>

            <p>
                Organize your days simply.
            </p>

        </div>

        <div class="account-area">

            <div class="account-pill">
                <span class="account-dot"></span>
                <span id="accountEmail">로그인됨</span>
            </div>

            <button id="logoutButton" type="button">
                로그아웃
            </button>

        </div>

    </div>


    <div class="workspace">

        <!-- =========================
             CALENDAR
        ========================= -->

        <section class="panel calendar-section">

            <div class="calendar-header">

                <div class="month-heading">

                    <span class="month-kicker">
                        Calendar
                    </span>

                    <div id="monthTitle"></div>

                </div>

                <div class="month-nav">

                    <button
                        id="prevMonth"
                        type="button"
                        aria-label="이전 달"
                    >
                        ‹
                    </button>

                    <button
                        id="nextMonth"
                        type="button"
                        aria-label="다음 달"
                    >
                        ›
                    </button>

                </div>

            </div>


            <div class="calendar">

                <div class="weekday">일</div>
                <div class="weekday">월</div>
                <div class="weekday">화</div>
                <div class="weekday">수</div>
                <div class="weekday">목</div>
                <div class="weekday">금</div>
                <div class="weekday">토</div>

            </div>

        </section>


        <!-- =========================
             TODO
        ========================= -->

        <section class="panel todo-section">

            <div class="todo-header">

                <div>

                    <small>
                        Selected day
                    </small>

                    <div id="selectedDateTitle">
                        날짜를 선택해주세요
                    </div>

                </div>

                <div
                    class="todo-total"
                    id="todoTotal"
                >
                    0
                </div>

            </div>


            <!-- CATEGORY ADD -->

            <div class="category-manager">

                <input
                    id="categoryInput"
                    type="text"

function loadCategories(){

    /*

        ["업무","개인"]

            }
        ]

        형태로 변환한다.
    */

    categories = saved.map((item,index)=>{

        if(typeof item === "string"){

            return {
                name:item,
                color:
                    COLOR_PALETTE[
                        index % COLOR_PALETTE.length
                    ].color
            };

        }

        return {
            name:item.name || "",
            color:item.color ||
                COLOR_PALETTE[
                    index % COLOR_PALETTE.length
                ].color
        };

    }).filter(item=>item.name);

}

/* =========================================================
   DATE
========================================================= */

function formatDateKey(y,m,d){

    return [
        y,
        String(m).padStart(2,"0"),
        String(d).padStart(2,"0")
    ].join("-");

}


/* =========================================================
   CALENDAR
========================================================= */

function renderCalendar(){

    const calendar =
        document.querySelector(
            ".calendar"
        );

    calendar
        .querySelectorAll(".day")
        .forEach(
            x=>x.remove()
        );


    document.getElementById(
        "monthTitle"
    ).textContent =
        `${currentYear}년 ${currentMonth+1}월`;


    const first =
        new Date(
            currentYear,
            currentMonth,
            1
        ).getDay();


    const last =
        new Date(
            currentYear,
            currentMonth+1,
            0
        ).getDate();


    for(
        let i=0;
        i<first;
        i++
    ){

        const empty =
            document.createElement("div");

        empty.className =
            "day";

        empty.style.cursor =
            "default";

        calendar.appendChild(empty);

    }


    for(
        let day=1;
        day<=last;
        day++
    ){

        const cell =
            document.createElement("div");

        cell.className =
            "day";


        const today =
            new Date();


        if(
            currentYear === today.getFullYear() &&
            currentMonth === today.getMonth() &&
            day === today.getDate()
        ){

            cell.classList.add(
                "today"
            );

        }


        const dateKey =
            formatDateKey(
                currentYear,
                currentMonth+1,
                day
            );


        if(
            selectedDateKey ===
            dateKey
        ){

            cell.classList.add(
                "selected"
            );

        }


        const number =
            document.createElement("div");

        number.textContent =
            day;

        cell.appendChild(number);


        if(
            todos[dateKey]?.length
        ){

            const count =
                document.createElement(
                    "div"
                );

            count.className =
                "todo-count";

            count.textContent =
                `${todos[dateKey].length}개`;

            cell.appendChild(count);

        }


        cell.onclick = ()=>{

            document
                .querySelectorAll(
                    ".day.selected"
                )
                .forEach(
                    x=>x.classList.remove(
                        "selected"
                    )
                );


            cell.classList.add(
                "selected"
            );


            selectedDateKey =
                dateKey;

            editingTodoIndex =
                null;


            document.getElementById(
                "selectedDateTitle"
            ).textContent =
                `${currentYear}년 ${currentMonth+1}월 ${day}일`;


            document.getElementById(
                "todoInput"
            ).value = "";


            document.getElementById(
                "todoCategory"
            ).value = "";


            document.getElementById(
                "addTodo"
            ).textContent =
                "＋";


            renderTodoList();

        };


        /* 날짜 이동 Drag & Drop */

        cell.ondragover = e=>{

            e.preventDefault();

            if(
                draggedTodoIndex !== null
            ){

                cell.classList.add(
                    "drag-over"
                );

            }

        };


        cell.ondragleave = ()=>{

            cell.classList.remove(
                "drag-over"
            );

        };


        cell.ondrop = e=>{

            e.preventDefault();

            cell.classList.remove(
                "drag-over"
            );


            if(
                draggedTodoIndex === null ||
                draggedTodoDateKey === null
            ){

                return;

            }


            const sourceKey =
                draggedTodoDateKey;

            const source =
                todos[sourceKey] || [];


            const moved =
                source.splice(
                    draggedTodoIndex,
                    1
                )[0];


            if(!moved){

                draggedTodoIndex = null;

                draggedTodoDateKey = null;

                return;

            }


            if(
                sourceKey === dateKey
            ){

                source.push(moved);

            }else{

                todos[dateKey] ??= [];

                todos[dateKey].push(
                    moved
                );

            }


            if(!source.length){

                delete todos[sourceKey];

            }


            draggedTodoIndex = null;

            draggedTodoDateKey = null;


            saveTodos();

            renderCalendar();

            renderTodoList();

        };


        calendar.appendChild(cell);

    }

}

/* =========================================================
   SAVE TODOS
========================================================= */

let saveTodosRunning = false;

let saveTodosWaiting = false;


async function saveTodos(){

    if(saveTodosRunning){

        saveTodosWaiting = true;

        return;

    }


    saveTodosRunning = true;


    try{

        localStorage.setItem(
            "myTodos",
            JSON.stringify(todos)
        );


        const {
            data:{user},
            error:userError
        } =
            await supabaseClient
                .auth
                .getUser();


        if(
            userError ||
            !user
        ){

            console.error(
                "사용자 확인 실패:",
                userError
            );

            return;

        }


        const {
            error:deleteError
        } =
            await supabaseClient
                .from("events")
                .delete()
                .eq(
                    "user_id",
                    user.id
                );


        if(deleteError){

            console.error(
                "기존 일정 삭제 실패:",
                deleteError
            );

            return;

        }


        const rows = [];


        Object.keys(todos).forEach(
            dateKey=>{

                (
                    todos[dateKey] || []
                ).forEach(
                    todo=>{

                        rows.push({

                            user_id:user.id,

                            title:
                                todo.text || "",

                            event_date:
                                dateKey,

                            category:
                                todo.category || "",

                            completed:
                                !!todo.completed

                        });

                    }
                );

            }
        );


        if(rows.length){

            const {
                error:insertError
            } =
                await supabaseClient
                    .from("events")
                    .insert(rows);


            if(insertError){

                console.error(
                    "Supabase 일정 저장 실패:",
                    insertError
                );

                return;

            }

        }


        console.log(
            "Supabase 일정 저장 완료:",
            rows.length,
            "개"
        );


    }catch(e){

        console.error(
            "일정 저장 중 오류:",
            e
        );


    }finally{

        saveTodosRunning = false;


        if(saveTodosWaiting){

            saveTodosWaiting = false;

            saveTodos();

        }

    }

}


/* =========================================================
   TODO SORT
========================================================= */

function sortTodos(arr){

    arr.sort(
        (a,b)=>
            a.completed === b.completed
                ? 0
                : (a.completed ? 1 : -1)
    );

}


/* =========================================================
   TOMATO COLOR CATEGORY
========================================================= */

function getTomatoColorClass(color){

    if(!color){

        return "pink";

    }


    let closest =
        COLOR_PALETTE[0];

    let minDistance =
        Infinity;


    function hexToRgb(hex){

        const clean =
            hex.replace("#","");

        return {

            r:parseInt(
                clean.substring(0,2),
                16
            ),

            g:parseInt(
                clean.substring(2,4),
                16
            ),

            b:parseInt(
                clean.substring(4,6),
                16
            )

        };

    }


    try{

        const rgb =
            hexToRgb(color);


        COLOR_PALETTE.forEach(item=>{

            const c =
                hexToRgb(item.color);


            const distance =
                Math.pow(
                    rgb.r-c.r,
                    2
                ) +
                Math.pow(
                    rgb.g-c.g,
                    2
                ) +
                Math.pow(
                    rgb.b-c.b,
                    2
                );


            if(
                distance < minDistance
            ){

                minDistance =
                    distance;

                closest =
                    item;

            }

        });

    }catch(e){}


    return closest.name;

}


/* =========================================================
   TODO LIST
========================================================= */

function renderTodoList(){

    const list =
        document.getElementById(
            "todoList"
        );


    list.innerHTML = "";


    if(!selectedDateKey){

        document.getElementById(
            "todoTotal"
        ).textContent = "0";

        return;

    }


    const dateTodos =
        todos[selectedDateKey] || [];


    sortTodos(dateTodos);


    document.getElementById(
        "todoTotal"
    ).textContent =
        dateTodos.length;


    const groups = {};


    dateTodos.forEach(
        todo=>{

            const category =
                todo.category ||
                "미분류";


            groups[category] ??= [];

            groups[category].push(
                todo
            );

        }
    );


    Object.keys(groups).forEach(
        category=>{

            const group =
                document.createElement(
                    "div"
                );

            group.className =
                "todo-category-group";


            const categoryData =
                getCategoryData(
                    category
                );


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "todo-category-title";

            title.textContent =
                category;

            title.style.setProperty(
                "--category-color",
                categoryData.color
            );


            group.appendChild(title);


            groups[category].forEach(
                todo=>{

                    const index =
                        dateTodos.indexOf(
                            todo
                        );


                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "todo-item";

                    item.draggable = true;


                    /* Drag 시작 */

                    item.ondragstart = e=>{

                        draggedTodoIndex =
                            index;

                        draggedTodoDateKey =
                            selectedDateKey;

                        item.classList.add(
                            "dragging"
                        );

                        e.dataTransfer.effectAllowed =
                            "move";

                        e.dataTransfer.setData(
                            "text/plain",
                            "todo"
                        );

                    };


                    item.ondragend = ()=>{

                        item.classList.remove(
                            "dragging"
                        );

                        document
                            .querySelectorAll(
                                ".todo-item.drag-over"
                            )
                            .forEach(
                                x=>
                                    x.classList.remove(
                                        "drag-over"
                                    )
                            );

                        draggedTodoIndex =
                            null;

                        draggedTodoDateKey =
                            null;

                    };


                    item.ondragover = e=>{

                        e.preventDefault();

                        if(
                            draggedTodoDateKey ===
                                selectedDateKey &&
                            draggedTodoIndex !== index
                        ){

                            item.classList.add(
                                "drag-over"
                            );

                        }

                    };


                    item.ondragleave = ()=>{

                        item.classList.remove(
                            "drag-over"
                        );

                    };


                    item.ondrop = e=>{

                        e.preventDefault();

                        e.stopPropagation();

                        item.classList.remove(
                            "drag-over"
                        );


                        if(
                            draggedTodoDateKey !==
                                selectedDateKey ||
                            draggedTodoIndex ===
                                index
                        ){

                            return;

                        }


                        const arr =
                            todos[selectedDateKey];


                        const from =
                            draggedTodoIndex;


                        const moved =
                            arr.splice(
                                from,
                                1
                            )[0];


                        let target =
                            index;


                        if(
                            from < target
                        ){

                            target--;

                        }


                        arr.splice(
                            target,
                            0,
                            moved
                        );


                        sortTodos(arr);


                        draggedTodoIndex =
                            null;

                        draggedTodoDateKey =
                            null;


                        saveTodos();

                        renderTodoList();

                        renderCalendar();

                    };


                    /* =====================
                       TOMATO CHECK
                    ===================== */

                    const tomato =
                        document.createElement(
                            "button"
                        );

                    tomato.type = "button";

                    tomato.className =
                        "tomato-check";


                    tomato.textContent =
                        "🍅";


                    tomato.title =
                        todo.completed
                            ? "완료 취소"
                            : "완료";


                    if(todo.completed){

                        tomato.classList.add(
                            "completed"
                        );

                        tomato.dataset.color =
                            getTomatoColorClass(
                                categoryData.color
                            );

                    }


                    tomato.onclick = e=>{

                        e.stopPropagation();

                        todo.completed =
                            !todo.completed;


                        sortTodos(
                            dateTodos
                        );


                        saveTodos();

                        renderTodoList();

                        renderCalendar();

                    };


                    /* =====================
                       TEXT
                    ===================== */

                    const text =
                        document.createElement(
                            "span"
                        );

                    text.className =
                        "todo-text";

                    text.textContent =
                        todo.text;


                    if(todo.completed){

                        text.classList.add(
                            "completed"
                        );

                    }


                    text.onclick = e=>{

                        e.stopPropagation();


                        editingTodoIndex =
                            index;


                        document.getElementById(
                            "todoInput"
                        ).value =
                            todo.text;


                        document.getElementById(
                            "todoCategory"
                        ).value =
                            todo.category || "";


                        document.getElementById(
                            "addTodo"
                        ).textContent =
                            "수정";

                    };


                    /* =====================
                       DELETE
                    ===================== */

                    const del =
                        document.createElement(
                            "button"
                        );

                    del.textContent =
                        "삭제";

                    del.className =
                        "delete-todo";

                    del.type = "button";


                    del.onclick = e=>{

                        e.stopPropagation();


                        dateTodos.splice(
                            index,
                            1
                        );


                        if(
                            !dateTodos.length
                        ){

                            delete todos[
                                selectedDateKey
                            ];

                        }


                        saveTodos();

                        renderTodoList();

                        renderCalendar();

                    };


                    item.append(
                        tomato,
                        text,
                        del
                    );


                    group.appendChild(
                        item
                    );

                }
            );


            list.appendChild(
                group
            );

        }
    );

}

    if(!category){

        alert(
            "카테고리를 선택해주세요."
        );

        return;

    }


    todos[selectedDateKey] ??= [];


    if(
        editingTodoIndex !== null
    ){

        const todo =
            todos[
                selectedDateKey
            ][
                editingTodoIndex
            ];


        if(todo){

            todo.text =
                text;

            todo.category =
                category;

        }


        editingTodoIndex =
            null;


    }else{

        todos[
            selectedDateKey
        ].push({

            text:text,

            category:category,

            completed:false

        });

    }


    input.value = "";

    document.getElementById(
        "todoCategory"
    ).value = "";


    document.getElementById(
        "addTodo"
    ).textContent =
        "＋";


    sortTodos(
        todos[selectedDateKey]
    );


    saveTodos();

    renderTodoList();

    renderCalendar();

};


document.getElementById(
    "todoInput"
).addEventListener(
    "keydown",
    e=>{

        if(e.key === "Enter"){

            document.getElementById(
                "addTodo"
            ).click();

    }
);


/* =========================================================
   LOAD SUPABASE TODOS
========================================================= */

async function loadSupabaseTodos(){

    const {
        data:{user},
        error:userError
    } =
        await supabaseClient
            .auth
            .getUser();


    if(
        userError ||
        !user
    ){

        console.error(
            "사용자 확인 실패:",
            userError
        );

        return;

    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from("events")
            .select("*")
            .eq(
                "user_id",
                user.id
            )
            .order(
                "event_date",
                {
                    ascending:true
                }
            );


    if(error){

        console.error(
            "Supabase 일정 불러오기 실패:",
            error
        );

        return;

    }


    const loaded = {};

    const seen = new Set();


    (data || []).forEach(
        event=>{

            const dateKey =
                String(
                    event.event_date || ""
                ).slice(0,10);


            if(!dateKey){

                return;

            }


            /*
                같은 이벤트가 DB에
                중복되어 있더라도
                화면에서는 한 번만 표시한다.
            */

            const key =
                [
                    dateKey,
                    event.title || "",
                    event.category || "",
                    !!event.completed
                ].join("\u0001");


            if(seen.has(key)){

                return;

            }


            seen.add(key);


            loaded[dateKey] ??= [];


            loaded[dateKey].push({

                supabaseId:
                    event.id,

                text:
                    event.title || "",

                category:
                    event.category || "",

                completed:
                    !!event.completed

            });

        }
    );


    todos =
        loaded;


    localStorage.setItem(
        "myTodos",
        JSON.stringify(todos)
    );


    renderCalendar();

    renderTodoList();


    console.log(
        "Supabase 일정 불러오기 완료:",
        data?.length || 0,
        "개"
    );

}


/* =========================================================
   AUTH
========================================================= */

const loginScreen =
    document.getElementById(
        "loginScreen"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const signupButton =
    document.getElementById(
        "signupButton"
    );

const loginEmail =
    document.getElementById(
        "loginEmail"
    );

const loginPassword =
    document.getElementById(
        "loginPassword"
    );

const authMessage =
    document.getElementById(
        "authMessage"
    );


/* =========================
   LOGIN
========================= */

loginButton.onclick = async()=>{

    const email =
        loginEmail.value.trim();

    const password =
        loginPassword.value;


    if(
        !email ||
        !password
    ){

        authMessage.textContent =
            "이메일과 비밀번호를 입력해주세요.";

        return;

    }


    authMessage.textContent =
        "로그인 중...";


    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .signInWithPassword({
                email,
                password
            });


    if(error){

        authMessage.textContent =
            "로그인 실패: " +
            error.message;

        return;

    }


    loginScreen.style.display =
        "none";


    authMessage.textContent =
        "";


    await loadSupabaseTodos();

};


/* =========================
   SIGN UP
========================= */

signupButton.onclick = async()=>{

    const email =
        loginEmail.value.trim();

    const password =
        loginPassword.value;


    if(
        !email ||
        !password
    ){

        authMessage.textContent =
            "이메일과 비밀번호를 입력해주세요.";

        return;

    }


    if(password.length < 6){

        authMessage.textContent =
            "비밀번호는 6자 이상이어야 합니다.";

        return;

    }


    authMessage.textContent =
        "회원가입 중...";


    const emailRedirectTo =
        window.location.origin +
        window.location.pathname;


    const {
        data,
        error
    } =
        await supabaseClient
            .auth
            .signUp({

                email,

                password,

                options:{
                    emailRedirectTo
                }

            });


    if(error){

        authMessage.textContent =
            "회원가입 실패: " +
            error.message;

        console.error(error);

        return;

    }


    if(
        data.user &&
        !data.session
    ){

        authMessage.textContent =
            "인증 메일을 보냈습니다. 이메일을 확인해주세요.";

        return;

    }


    authMessage.textContent =
        "회원가입이 완료되었습니다.";

};


/* =========================================================
   EMAIL VERIFICATION
========================================================= */

let verificationCallbackHandled =
    false;


function isVerificationCallback(){

    const hash =
        window.location.hash || "";

    const search =
        window.location.search || "";


    return (
        hash.includes("access_token") ||
        hash.includes("type=signup") ||
        hash.includes("type=recovery") ||
        new URLSearchParams(
            search
        ).has("code")
    );

}


function cleanAuthUrl(){

    try{

        window.history.replaceState(
            {},
            document.title,
            window.location.pathname
        );

    }catch(e){

        console.warn(
            "인증 URL 정리 실패:",
            e
        );

    }

}


async function showAuthSuccess(){

    verificationCallbackHandled =
        true;


    document
        .getElementById(
            "authSuccessScreen"
        )
        .classList.add(
            "show"
        );


    loginScreen.style.display =
        "none";


    document.querySelector(
        ".app"
    ).style.display =
        "none";

}


function hideAuthSuccess(){

    document
        .getElementById(
            "authSuccessScreen"
        )
        .classList.remove(
            "show"
        );


    document.querySelector(
        ".app"
    ).style.display =
        "";

}


document.getElementById(
    "continueAfterVerification"
).onclick = async()=>{

    hideAuthSuccess();

    cleanAuthUrl();


    const {
        data:{session}
    } =
        await supabaseClient
            .auth
            .getSession();


    if(session){

        loginScreen.style.display =
            "none";


        await loadSupabaseTodos();

    }else{

        loginScreen.style.display =
            "flex";


        authMessage.textContent =
            "이메일 인증이 완료되었습니다. 이제 로그인해주세요.";

    }

};


/* =========================================================
   LOGIN STATUS
========================================================= */

async function checkLoginStatus(){

    const callback =
        isVerificationCallback();


    const {
        data:{session},
        error
    } =
        await supabaseClient
            .auth
            .getSession();


    if(error){

        console.error(
            "로그인 상태 확인 실패:",
            error
        );


        loginScreen.style.display =
            "flex";


        return;

    }


    if(callback){

        await showAuthSuccess();

        return;

    }


    if(session){

        loginScreen.style.display =
            "none";


        await loadSupabaseTodos();

    }else{

        loginScreen.style.display =
            "flex";

    }

}

loadCategories();

renderColorPalette();

/* =========================================================
   ACCOUNT UI
========================================================= */

(function(){

    const emailEl =
        document.getElementById(
            "accountEmail"
        );


    const totalEl =
        document.getElementById(
            "todoTotal"
        );


    const logoutButton =
        document.getElementById(
            "logoutButton"
        );


    async function refreshAccountUI(){

        try{

            const {
                data:{session}
            } =
                await supabaseClient
                    .auth
                    .getSession();


            if(
                session &&
                session.user
            ){

                emailEl.textContent =
                    session.user.email ||
                    "로그인됨";


                logoutButton.style.display =
                    "";

            }else{

                emailEl.textContent =
                    "로그인 필요";


                logoutButton.style.display =
                    "none";

            }

        }catch(e){

            console.error(e);

        }

    }


    async function logout(){

        const {
            error
        } =
            await supabaseClient
                .auth
                .signOut();


        if(error){

            alert(
                "로그아웃에 실패했습니다."
            );

            console.error(error);

            return;

        }


        location.reload();

    }


    logoutButton.addEventListener(
        "click",
        logout
    );


    const observer =
        new MutationObserver(
            function(){

                try{

                    const list =
                        document.getElementById(
                            "todoList"
                        );


                    totalEl.textContent =
                        list &&
                        list.querySelectorAll(
                            ".todo-item"
                        ).length ||
                        0;

                }catch(e){}

            }
        );


    observer.observe(
        document.getElementById(
            "todoList"
        ),
        {
            childList:true,
            subtree:true
        }
    );


    supabaseClient.auth.onAuthStateChange(
        function(){

            setTimeout(
                refreshAccountUI,
                0
            );

        }
    );


    refreshAccountUI();

})();

</script>
